---
Identifier: com.github.woodleighschool.download.assetcache-exporter
MinimumVersion: "3.0"

Input:
  NAME: assetcache-exporter

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments:
      asset_regex: "^assetcache-exporter-[0-9]+(?:\\.[0-9]+)+\\.pkg$"
      github_repo: woodleighschool/assetcache-exporter

  - Processor: URLDownloader
    Arguments:
      filename: "%NAME%-%version%.pkg"

  - Processor: EndOfCheckPhase

  - Processor: CodeSignatureVerifier
    Arguments:
      expected_authority_names:
        - "Developer ID Installer: Woodleigh School (SMLKBTR495)"
        - "Developer ID Certification Authority"
        - "Apple Root CA"
      input_path: "%pathname%"
