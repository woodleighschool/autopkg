---
Identifier: com.github.woodleighschool.download.EasyFind
MinimumVersion: "1.1.0"

Input:
  DOWNLOAD_URL: https://www.devontechnologies.com/apps/freeware
  NAME: EasyFind

Process:
  - Processor: URLTextSearcher
    Arguments:
      re_pattern: "'(https://.*EasyFind\\.app\\.zip)'"
      url: "%DOWNLOAD_URL%"

  - Processor: URLDownloader
    Arguments:
      filename: "%NAME%.zip"
      url: "%match%"

  - Processor: EndOfCheckPhase
