---
Identifier: com.github.woodleighschool.pkg.EasyFind
ParentRecipe: com.github.jleggat.EasyFind.download
MinimumVersion: 1.1.0

Input:
  APP_DESTINATION: /Applications/Utilities
  NAME: EasyFind

Process:
  - Processor: Versioner
    Arguments:
      input_plist_path: "%RECIPE_CACHE_DIR%/%NAME%/%NAME%.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: DmgCreator
    Arguments:
      dmg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
      dmg_root: "%RECIPE_CACHE_DIR%/%NAME%"

  - Processor: VariableSetter
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/%NAME%"
