---
Identifier: com.github.woodleighschool.munki.EasyFind
ParentRecipe: com.github.woodleighschool.pkg.EasyFind
MinimumVersion: "1.1.0"

Input:
  MUNKI_CATEGORY: Utilities
  NAME: EasyFind
  pkginfo:
    blocking_applications:
      - EasyFind
    category: "%MUNKI_CATEGORY%"
    description: >-
      Spotlight is great, but sometimes you need something more specialized.
      EasyFind finds files and folders by name, content, tags, or comments
      using advanced Boolean operators, wildcards, phrases, even regular
      expressions. It does not require indexing, is fast, and uses very little
      memory.
    developer: DEVONtechnologies
    name: "%NAME%"
    unattended_install: true
    unattended_uninstall: true
    uninstall_method: remove_copied_items
    uninstallable: true

Process:
  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/payload/Applications/%NAME%.app"
      overwrite: true
      source_path: "%pkg_path%/%NAME%.app"

  - Processor: MunkiInstallsItemsCreator
    Arguments:
      derive_minimum_os_version: true
      faux_root: "%RECIPE_CACHE_DIR%/payload"
      installs_item_paths:
        - /Applications/%NAME%.app

  - Processor: MunkiPkginfoMerger

  - Processor: com.github.woodleighschool.processors/SwiftIconExtractor
    Arguments:
      app_name: "%NAME%.app"
      NAME: "%NAME%"
      output_dir: "%RECIPE_CACHE_DIR%"
      pathname: "%pkg_path%"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/payload"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      pkg_path: "%pkg_path%"
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Hosts
            package:
              strategy: latest

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiPackageCleaner
    Arguments:
      keep_version_count: 1
