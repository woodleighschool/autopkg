---
Identifier: com.github.woodleighschool.munki.EPSONDrivers
ParentRecipe: com.github.woodleighschool.download.EPSONDrivers
MinimumVersion: "2.7"

Input:
  MUNKI_CATEGORY: Utilities
  NAME: EPSON Drivers
  pkginfo:
    blocking_applications: []
    category: "%MUNKI_CATEGORY%"
    description: >-
      Installs the Epson AM-C6000 Series printer driver.
    developer: Epson
    name: "%NAME%"
    unattended_install: true
    unattended_uninstall: true
    uninstall_method: removepackages
    uninstallable: true

Process:
  - Processor: PkgCopier
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
      source_pkg: "%pathname%/EPSON Printer.pkg"

  - Processor: MunkiPkginfoMerger
    Arguments:
      additional_pkginfo:
        installs:
          - CFBundleIdentifier: com.epson.ijprinter.data.AM-C6000 Series
            CFBundleName: AM-C6000 Series
            CFBundleShortVersionString: "%version%"
            path: /Library/Printers/EPSON/InkjetPrinter2/SupportPrinters/AM-C6000 Series.data
            type: bundle
        version: "%version%"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%RECIPE_REPO_DIR%/com.github.woodleighschool.autopkg/EPSONDrivers/EPSON Drivers.png"
      pkg_path: "%pkg_path%"
      targets:
        exclude: []
        include:
          - actions:
              - managed_updates
            label_name: All Hosts
            package:
              strategy: latest

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiPackageCleaner
    Arguments:
      keep_version_count: 1
