---
Identifier: com.github.woodleighschool.munki.DanteVirtualSoundcard
ParentRecipe: com.github.dataJAR-recipes.download.Audinate Dante Virtual Soundcard
MinimumVersion: "1.1.0"

Input:
  MUNKI_CATEGORY: System
  NAME: Dante Virtual Soundcard
  pkginfo:
    blocking_applications: []
    category: "%MUNKI_CATEGORY%"
    description: >-
      Dante Virtual Soundcard turns your computer into a Dante-powered
      workstation, seamlessly integrating your PC or Mac with Dante audio
      devices on your network. Instantly connect to record, process and
      playout using any audio application and any combination of
      Dante-enabled devices.
    developer: Audinate
    name: "%NAME%"
    unattended_install: true
    unattended_uninstall: true
    uninstall_method: uninstall_script
    uninstall_script: |
      #!/bin/sh

      # Exits 0 if uninstall is successful, 1 if unsuccessful

      UNINSTALL_PATH="/Library/Application Support/Audinate/DanteVirtualSoundcard/Uninstall DVS.app/Contents/Resources/uninstall.sh"

      if [ ! -f "$UNINSTALL_PATH" ]; then
          echo "Error: DVS uninstaller not found"
          exit 1
      fi

      "$UNINSTALL_PATH"
      exit $?
    uninstallable: true

Process:
  - Processor: FlatPkgUnpacker
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/unpacked"
      flat_pkg_path: "%pathname%/DanteVirtualSoundcard.pkg"
      purge_destination: true

  - Processor: PkgPayloadUnpacker
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/payload"
      pkg_payload_path: "%RECIPE_CACHE_DIR%/unpacked/DVS_User_Interface.pkg/Payload"
      purge_destination: true

  - Processor: Versioner
    Arguments:
      input_plist_path: "%RECIPE_CACHE_DIR%/payload/Applications/Dante Virtual Soundcard.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: PkgCopier
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
      source_pkg: "%pathname%/DanteVirtualSoundcard.pkg"

  - Processor: MunkiInstallsItemsCreator
    Arguments:
      derive_minimum_os_version: true
      faux_root: "%RECIPE_CACHE_DIR%/payload"
      installs_item_paths:
        - "/Applications/Dante Virtual Soundcard.app"

  - Processor: MunkiPkginfoMerger

  - Processor: com.github.woodleighschool.processors/MunkiIconExtractor
    Arguments:
      NAME: "%NAME%"
      output_dir: "%RECIPE_CACHE_DIR%"
      pathname: "%RECIPE_CACHE_DIR%/payload/Applications/Dante Virtual Soundcard.app"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/unpacked"
        - "%RECIPE_CACHE_DIR%/payload"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      pkg_path: "%pkg_path%"
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
            label_name: All Hosts
            package:
              strategy: latest

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiPackageCleaner
    Arguments:
      keep_version_count: 1
