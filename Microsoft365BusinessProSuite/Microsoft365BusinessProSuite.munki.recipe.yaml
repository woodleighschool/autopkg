---
Identifier: com.github.woodleighschool.munki.Microsoft365BusinessProSuite
ParentRecipe: com.github.rtrouton.download.MicrosoftOffice365BusinessProSuite
MinimumVersion: "2.7"

Input:
  MUNKI_CATEGORY: Productivity
  NAME: Microsoft 365 Business Pro Suite
  pkginfo:
    blocking_applications:
      - Microsoft AutoUpdate
      - Microsoft Outlook
      - Microsoft Excel
      - Microsoft PowerPoint
      - Microsoft Word
      - Microsoft OneNote
      - Microsoft Teams
    category: "%MUNKI_CATEGORY%"
    description: >-
      This suite ties everything together, offering enhanced security, business-class email,
      and additional tools designed to boost efficiency and collaboration.
    developer: Microsoft
    minimum_os_version: "13.0"
    name: "%NAME%"
    # This suite is a one-shot bootstrap. MAU and the individual app recipes
    # own updates and repair after Microsoft 365 has been installed.
    receipts:
      - packageid: com.microsoft.package.Frameworks
        version: "0"
    unattended_install: true
    uninstall_method: ""
    uninstallable: false

Process:
  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      additional_makepkginfo_options:
        - --pkgvers
        - "%version%"
      icon_path: "%RECIPE_REPO_DIR%/com.github.woodleighschool.autopkg/Microsoft365BusinessProSuite/Microsoft 365 Suite.png"
      pkg_path: "%pathname%"
      targets:
        exclude: []
        include:
          - actions:
              - managed_installs
            label_name: All Hosts
            package:
              strategy: latest

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiPackageCleaner
    Arguments:
      keep_version_count: 1
