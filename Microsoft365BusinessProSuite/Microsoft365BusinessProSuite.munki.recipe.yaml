---
Identifier: com.github.woodleighschool.munki.Microsoft365BusinessProSuite
ParentRecipe: com.github.rtrouton.download.MicrosoftOffice365BusinessProSuite
MinimumVersion: "2.7"

Input:
  MUNKI_CATEGORY: Productivity
  NAME: Microsoft 365 Business Pro Suite
  pkginfo:
    blocking_applications:
      - Microsoft AutoUpdate
      - Microsoft Outlook
      - Microsoft Excel
      - Microsoft PowerPoint
      - Microsoft Word
      - Microsoft OneNote
      - Microsoft Teams
    category: "%MUNKI_CATEGORY%"
    description: >-
      This suite ties everything together, offering enhanced security, business-class email,
      and additional tools designed to boost efficiency and collaboration.
    developer: Microsoft
    minimum_os_version: "13.0"
    name: "%NAME%"
    unattended_install: true
    unattended_uninstall: true
    uninstall_method: removepackages
    uninstallable: true

Process:
  - Processor: PkgCopier
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
      source_pkg: "%pathname%"

  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      overwrite: false
      source_path: "%RECIPE_DIR%/Microsoft 365 Suite.png"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      additional_makepkginfo_options:
        - --pkgvers
        - "%version%"
      icon_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      pkg_path: "%pkg_path%"
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
            label_name: All Hosts
            package:
              strategy: latest
