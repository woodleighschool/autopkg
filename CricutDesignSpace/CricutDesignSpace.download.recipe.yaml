---
Identifier: com.github.woodleighschool.download.CricutDesignSpace
ParentRecipe: com.github.nstrauss.download.CricutDesignSpace
MinimumVersion: "2.7"

Input:
  NAME: Cricut Design Space

Process:
  - Processor: Versioner
    Arguments:
      input_plist_path: "%pathname%/Cricut Design Space.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
      overwrite: false
      source_path: "%pathname%"

  - Processor: VariableSetter
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
