---
Identifier: com.github.woodleighschool.download.Audacity
ParentRecipe: com.github.dataJAR-recipes.download.Audacity
MinimumVersion: "2.7"

Input:
  ARCHITECTURE: arm64
  NAME: Audacity
  PRERELEASE: ""

Process:
  - Processor: Versioner
    Arguments:
      input_plist_path: "%pathname%/Audacity.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
      overwrite: false
      source_path: "%pathname%"

  - Processor: VariableSetter
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
