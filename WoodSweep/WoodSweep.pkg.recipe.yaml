---
Identifier: com.github.woodleighschool.pkg.WoodSweep
ParentRecipe: com.github.woodleighschool.download.WoodSweep
MinimumVersion: "2.7"

Input:
  NAME: WoodSweep

Process:
  - Processor: Unarchiver
    Arguments:
      archive_path: "%pathname%"
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%"
      purge_destination: true

  - Processor: CodeSignatureVerifier
    Arguments:
      deep_verification: true
      input_path: "%RECIPE_CACHE_DIR%/%NAME%/%NAME%.app"
      requirement: >-
        anchor apple generic and identifier
        "au.edu.vic.woodleigh.WoodSweep" and
        (certificate leaf[field.1.2.840.113635.100.6.1.9] /* exists */ or
        certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and
        certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and
        certificate leaf[subject.OU] = "SMLKBTR495")
      strict_verification: true

  - Processor: Versioner
    Arguments:
      input_plist_path: "%RECIPE_CACHE_DIR%/%NAME%/%NAME%.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: DmgCreator
    Arguments:
      dmg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
      dmg_root: "%RECIPE_CACHE_DIR%/%NAME%"

  - Processor: VariableSetter
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/%NAME%"
