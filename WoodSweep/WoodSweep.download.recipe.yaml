---
Identifier: com.github.woodleighschool.download.WoodSweep
MinimumVersion: "2.7"

Input:
  NAME: WoodSweep

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments:
      asset_regex: "^WoodSweep-[0-9]+(?:\\.[0-9]+)*\\.zip$"
      github_repo: woodleighschool/woodsweep

  - Processor: URLDownloader
    Arguments:
      filename: "%NAME%-%version%.zip"

  - Processor: EndOfCheckPhase

  - Processor: Unarchiver
    Arguments:
      archive_path: "%pathname%"
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%"
      purge_destination: true

  - Processor: CodeSignatureVerifier
    Arguments:
      expected_authority_names:
        - "Developer ID Application: Woodleigh School (SMLKBTR495)"
        - Developer ID Certification Authority
        - Apple Root CA
      input_path: "%destination_path%/%NAME%.app"
