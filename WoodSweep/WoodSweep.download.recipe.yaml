---
Identifier: com.github.woodleighschool.download.WoodSweep
MinimumVersion: "2.7"

Input:
  NAME: WoodSweep

Process:
  - Processor: GitHubReleasesInfoProvider
    Arguments:
      asset_regex: "^WoodSweep-[0-9]+(?:\\.[0-9]+)*\\.zip$"
      github_repo: woodleighschool/woodsweep

  - Processor: URLDownloader
    Arguments:
      filename: "%NAME%-%version%.zip"

  - Processor: EndOfCheckPhase

  - Processor: Unarchiver
    Arguments:
      archive_path: "%pathname%"
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%"
      purge_destination: true

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: "%destination_path%/%NAME%.app"
      requirement: >-
        anchor apple generic and identifier "au.edu.vic.woodleigh.WoodSweep" and
        (certificate leaf[field.1.2.840.113635.100.6.1.9] /* exists */ or
        certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and
        certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and
        certificate leaf[subject.OU] = SMLKBTR495)
