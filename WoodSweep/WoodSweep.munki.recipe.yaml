---
Identifier: com.github.woodleighschool.munki.WoodSweep
ParentRecipe: com.github.woodleighschool.pkg.WoodSweep
MinimumVersion: "2.7"

GitOps: true
Input:
  MUNKI_CATEGORY: Utilities
  NAME: WoodSweep
  pkginfo:
    blocking_applications:
      - WoodSweep
    category: "%MUNKI_CATEGORY%"
    description: >-
      WoodSweep snapshots a configured local account, resets Microsoft Office
      user state, and reconciles the account home after the snapshot succeeds.
    developer: Woodleigh School
    name: "%NAME%"
    postinstall_script: |-
      #!/bin/zsh --no-rcs

      set -euo pipefail

      app="/Applications/WoodSweep.app/Contents/MacOS/WoodSweep"
      logged_in_user="$(/usr/bin/stat -f '%Su' /dev/console)"
      if [[ -z "${logged_in_user}" || "${logged_in_user}" == "root" || "${logged_in_user}" == "loginwindow" ]]; then
          echo "WoodSweep bootstrap requires a logged-in user." >&2
          exit 1
      fi

      user_id="$(/usr/bin/id -u "${logged_in_user}")"

      /bin/launchctl asuser "${user_id}" \
          /usr/bin/sudo -u "${logged_in_user}" \
          "${app}" bootstrap \
          --server-url "%WOODSWEEP_SERVER_URL%" \
          --bootstrap-user "%WOODSWEEP_BOOTSTRAP_USER%" \
          --bootstrap-password "%WOODSWEEP_BOOTSTRAP_PASSWORD%"
    preinstall_script: |-
      #!/bin/zsh --no-rcs

      logged_in_user="$(/usr/bin/stat -f '%Su' /dev/console)"
      if [[ -z "${logged_in_user}" || "${logged_in_user}" == "root" || "${logged_in_user}" == "loginwindow" ]]; then
          echo "WoodSweep bootstrap requires a logged-in user. Deferring installation." >&2
          exit 1
      fi
    unattended_install: true
    unattended_uninstall: true
    uninstall_method: remove_copied_items
    uninstallable: true

Process:
  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/payload/Applications/%NAME%.app"
      overwrite: true
      source_path: "%pkg_path%/%NAME%.app"

  - Processor: MunkiInstallsItemsCreator
    Arguments:
      derive_minimum_os_version: true
      faux_root: "%RECIPE_CACHE_DIR%/payload"
      installs_item_paths:
        - /Applications/%NAME%.app

  - Processor: MunkiPkginfoMerger

  - Processor: com.github.woodleighschool.processors/MunkiIconExtractor
    Arguments:
      NAME: "%NAME%"
      output_dir: "%RECIPE_CACHE_DIR%"
      overwrite: false
      pathname: "%RECIPE_CACHE_DIR%/payload/Applications/%NAME%.app"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/payload"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      munkiimport_appname: "%NAME%.app"
      pkg_path: "%pkg_path%"
      targets:
        exclude: []
        include:
          - actions:
              - managed_installs
            label_name: SAC MacBooks
            package:
              strategy: latest

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiPackageCleaner
    Arguments:
      keep_version_count: 1
