---
Identifier: com.github.woodleighschool.download.Godot
ParentRecipe: com.github.dataJAR-recipes.download.Godot 4
MinimumVersion: "1.1"

Input:
  NAME: Godot
  PRERELEASE: ""

Process:
  - Processor: Versioner
    Arguments:
      input_plist_path: "%pathname%/Godot.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
      overwrite: false
      source_path: "%pathname%"

  - Processor: VariableSetter
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
