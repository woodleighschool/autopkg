---
Identifier: com.github.woodleighschool.munki.Godot
ParentRecipe: com.github.dataJAR-recipes.download.Godot 4
MinimumVersion: "3.0"

Input:
  MUNKI_CATEGORY: Programming
  NAME: Godot
  PRERELEASE: ""
  pkginfo:
    category: "%MUNKI_CATEGORY%"
    description: >-
      Godot is a free and open-source game development engine for 2D and 3D games,
      with a scene and node structure that can be extended with GDScript.
    developer: Godot Foundation
    name: "%NAME%"
    unattended_install: true
    unattended_uninstall: true
    uninstall_method: remove_copied_items
    uninstallable: true

Process:
  - Processor: com.github.woodleighschool.processors/SwiftIconExtractor
    Arguments:
      input_path: "%pkgroot%/Applications/Godot.app"

  - Processor: DmgCreator
    Arguments:
      dmg_path: "%RECIPE_CACHE_DIR%/Godot.dmg"
      dmg_root: "%pkgroot%/Applications"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%pkgroot%"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%icon_path%"
      munkiimport_appname: Godot.app
      pkg_path: "%dmg_path%"
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Hosts
            package:
              strategy: latest

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiPackageCleaner
    Arguments:
      keep_version_count: 1
