---
Identifier: com.github.woodleighschool.intune.swiftDialog
ParentRecipe: com.github.woodleighschool.download.swiftDialog
MinimumVersion: "3.0"

Input:
  description: >-
    swiftDialog is an open source admin utility for macOS 12 or later
    written in SwiftUI that presents custom dialogs, displays informative
    messages or can be used as a form to request user input.
  NAME: swiftDialog
  publisher: CSIRO

Process:
  - Processor: FlatPkgUnpacker
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/unpacked"
      flat_pkg_path: "%pathname%"
      purge_destination: true

  - Processor: PkgPayloadUnpacker
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/payload"
      pkg_payload_path: "%RECIPE_CACHE_DIR%/unpacked/tmp-package.pkg/Payload"
      purge_destination: true

  - Processor: PlistReader
    Arguments:
      info_path: "%RECIPE_CACHE_DIR%/payload/Library/Application Support/Dialog/Dialog.app/Contents/Info.plist"
      plist_keys:
        CFBundleIdentifier: bundle_id
        CFBundleShortVersionString: bundle_version

  - Processor: com.github.woodleighschool.processors/SwiftIconExtractor
    Arguments:
      input_path: "%RECIPE_CACHE_DIR%/payload/Library/Application Support/Dialog/Dialog.app"

      NAME: "%NAME%"
      output_dir: "%RECIPE_CACHE_DIR%"
      overwrite: true
  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/unpacked"
        - "%RECIPE_CACHE_DIR%/payload"

  - Processor: com.github.almenscorner.intune-upload.processors/IntuneAppUploader
    Arguments:
      app_file: "%flat_pkg_path%"
      assignment_info:
        - all_assignment: AllDevices
          intent: Required
      bundleId: "%bundle_id%"
      bundleVersion: "%bundle_version%"
      description: "%description%"
      displayname: "%NAME%"
      icon: "%icon_path%"
      ignore_version_detection: true
      minimumSupportedOperatingSystem: v15_0
      publisher: "%publisher%"
      sync_assignments: true
