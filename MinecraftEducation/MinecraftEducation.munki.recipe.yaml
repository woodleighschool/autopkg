---
Identifier: com.github.woodleighschool.munki.MinecraftEducation
ParentRecipe: com.github.woodleighschool.download.MinecraftEducation
MinimumVersion: "2.7"

Input:
  MUNKI_CATEGORY: Education
  NAME: Minecraft Education
  pkginfo:
    blocking_applications:
      - minecraft-edu
    category: "%MUNKI_CATEGORY%"
    description: >-
      Engage students in game-based learning across the curriculum. Minecraft
      Education is a game-based platform that inspires creative, inclusive
      learning through play. Explore blocky words that unlock new ways to take on
      any subject or challenge.
    developer: Microsoft
    name: "%NAME%"
    unattended_install: true
    unattended_uninstall: true
    uninstall_method: remove_copied_items
    uninstallable: true

Process:
  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/payload/Applications/minecraft-edu.app"
      overwrite: true
      source_path: "%pkg_path%/minecraft-edu.app"

  - Processor: MunkiInstallsItemsCreator
    Arguments:
      derive_minimum_os_version: true
      faux_root: "%RECIPE_CACHE_DIR%/payload"
      installs_item_paths:
        - /Applications/minecraft-edu.app

  - Processor: MunkiPkginfoMerger

  - Processor: com.github.woodleighschool.processors/SwiftIconExtractor
    Arguments:
      NAME: "%NAME%"
      output_dir: "%RECIPE_CACHE_DIR%"
      pathname: "%RECIPE_CACHE_DIR%/payload/Applications/minecraft-edu.app"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/payload"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      munkiimport_appname: minecraft-edu.app
      pkg_path: "%pkg_path%"
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: Minecraft Education Licence
            package:
              strategy: latest
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Staff
            package:
              strategy: latest

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiPackageCleaner
    Arguments:
      keep_version_count: 1
