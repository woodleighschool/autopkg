---
Identifier: com.github.woodleighschool.munki.WacomTabletDriver
ParentRecipe: com.github.woodleighschool.download.WacomTabletDriver
MinimumVersion: "3.0"

Input:
  MUNKI_CATEGORY: Creativity
  NAME: Wacom Tablet Driver
  pkginfo:
    blocking_applications:
      - Wacom Center
      - Wacom Display Settings
      - Wacom Tablet Utility
    category: "%MUNKI_CATEGORY%"
    description: >-
      These are the drivers needed to use any Wacom pad or display. You may
      need to reinstall these when you update your MacBook's OS.
    developer: Wacom
    name: "%NAME%"
    unattended_install: true
    unattended_uninstall: true
    uninstall_method: removepackages
    uninstallable: true

Process:
  - Processor: FlatPkgUnpacker
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/unpack"
      flat_pkg_path: "%pathname%/Install Wacom Tablet.pkg"
      purge_destination: true

  - Processor: PkgPayloadUnpacker
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/payload"
      pkg_payload_path: "%RECIPE_CACHE_DIR%/unpack/content.pkg/Payload"
      purge_destination: true

  - Processor: PlistReader
    Arguments:
      info_path: "%RECIPE_CACHE_DIR%/payload/Applications/Wacom Tablet.localized/Wacom Center.app/Contents/Info.plist"
      plist_keys:
        CFBundleIdentifier: bundle_identifier
        CFBundleName: bundle_name
        CFBundleShortVersionString: short_version
        CFBundleVersion: version
        LSMinimumSystemVersion: min_os_ver

  - Processor: PkgCopier
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
      source_pkg: "%pathname%/Install Wacom Tablet.pkg"

  - Processor: MunkiPkginfoMerger
    Arguments:
      additional_pkginfo:
        installs:
          - CFBundleIdentifier: "%bundle_identifier%"
            CFBundleName: "%bundle_name%"
            CFBundleShortVersionString: "%short_version%"
            CFBundleVersion: "%version%"
            path: /Applications/Wacom Tablet.localized/Wacom Center.app
            type: application
            version_comparison_key: CFBundleVersion
        minimum_os_version: "%min_os_ver%"
        version: "%version%"

  - Processor: com.github.woodleighschool.processors/SwiftIconExtractor
    Arguments:
      input_path: "%RECIPE_CACHE_DIR%/payload/Applications/Wacom Tablet.localized/Wacom Center.app"

      NAME: "%NAME%"
      output_dir: "%RECIPE_CACHE_DIR%"
  - Processor: com.github.woodleighschool.processors/PathChmod
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/unpack"
        - "%RECIPE_CACHE_DIR%/payload"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/unpack"
        - "%RECIPE_CACHE_DIR%/payload"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      pkg_path: "%pkg_path%"
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Hosts
            package:
              strategy: latest

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiPackageCleaner
    Arguments:
      keep_version_count: 1
