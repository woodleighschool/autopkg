---
Identifier: com.github.woodleighschool.download.UltiMakerCura
ParentRecipe: com.github.dataJAR-recipes.download.Ultimaker Cura
MinimumVersion: "2.7"

Input:
  ARCH: ARM64
  NAME: UltiMaker Cura
  PRERELEASE: ""
  SUPPORTED_ARCH: arm64

Process:
  - Processor: Versioner
    Arguments:
      input_plist_path: "%pathname%/UltiMaker Cura.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
      overwrite: false
      source_path: "%pathname%"

  - Processor: VariableSetter
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
