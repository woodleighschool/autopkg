---
Identifier: com.github.woodleighschool.munki.Keynote
MinimumVersion: "2.7"

Input:
  APP_NAME: Keynote Creator Studio
  MUNKI_CATEGORY: Productivity
  NAME: Keynote
  pkginfo:
    blocking_applications:
      - Keynote
    category: "%MUNKI_CATEGORY%"
    description: >-
      Keynote is Apple's presentation app for creating and delivering
      presentations.
    developer: Apple
    name: "%NAME%"
    preinstall_script: |-
      #!/bin/zsh --no-rcs

      /bin/rm -rf "/Applications/Keynote.app"
    unattended_install: true
    unattended_uninstall: true
    uninstall_method: remove_copied_items
    uninstallable: true

Process:
  - Processor: FileFinder
    Arguments:
      pattern: /Applications/%APP_NAME%.app

  - Processor: PlistReader
    Arguments:
      info_path: "%found_filename%"
      plist_keys:
        CFBundleShortVersionString: version

  - Processor: com.github.woodleighschool.processors/SwiftIconExtractor
    Arguments:
      input_path: "%found_filename%"

      NAME: "%NAME%"
      output_dir: "%RECIPE_CACHE_DIR%"
  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/payload/%APP_NAME%.app"
      overwrite: true
      source_path: "%found_filename%"

  - Processor: DmgCreator
    Arguments:
      dmg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
      dmg_root: "%RECIPE_CACHE_DIR%/payload"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/payload"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      munkiimport_appname: "%APP_NAME%.app"
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Hosts
            package:
              strategy: latest

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiPackageCleaner
    Arguments:
      keep_version_count: 1
