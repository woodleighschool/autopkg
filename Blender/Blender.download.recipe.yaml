---
Identifier: com.github.woodleighschool.download.Blender
ParentRecipe: io.github.hjuutilainen.download.Blender
MinimumVersion: "2.7"

Input:
  ARCHITECTURE: arm64
  MAJOR_VERSION: "5"
  NAME: Blender

Process:
  - Processor: Versioner
    Arguments:
      input_plist_path: "%pathname%/Blender.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
      overwrite: false
      source_path: "%pathname%"

  - Processor: VariableSetter
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
