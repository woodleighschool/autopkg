---
Identifier: com.github.woodleighschool.munki.BambuStudio
ParentRecipe: com.github.woodleighschool.download.BambuStudio
MinimumVersion: "1.1.0"

Input:
  MUNKI_CATEGORY: STEAM
  NAME: BambuStudio
  PRERELEASE: "true"
  pkginfo:
    blocking_applications:
      - BambuStudio
    category: "%MUNKI_CATEGORY%"
    description: >-
      Bambu Studio is an open-source, cutting-edge, feature-rich slicing
      software. It contains project-based workflows, systematically optimized
      slicing algorithms, and an easy-to-use graphical interface, bringing
      users an incredibly smooth printing experience.
    developer: Bambu Lab
    name: "%NAME%"
    unattended_install: true
    unattended_uninstall: true
    uninstall_method: remove_copied_items
    uninstallable: true

Process:
  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/payload/Applications/%NAME%.app"
      overwrite: true
      source_path: "%pkg_path%/%NAME%.app"

  - Processor: MunkiInstallsItemsCreator
    Arguments:
      derive_minimum_os_version: true
      faux_root: "%RECIPE_CACHE_DIR%/payload"
      installs_item_paths:
        - /Applications/%NAME%.app

  - Processor: MunkiPkginfoMerger

  - Processor: com.github.woodleighschool.processors/SwiftIconExtractor
    Arguments:
      input_path: "%RECIPE_CACHE_DIR%/payload/Applications/%NAME%.app"

      NAME: "%NAME%"
      output_dir: "%RECIPE_CACHE_DIR%"
  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/payload"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      munkiimport_appname: "%NAME%.app"
      pkg_path: "%pkg_path%"
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Hosts
            package:
              strategy: latest

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiPackageCleaner
    Arguments:
      keep_version_count: 1
