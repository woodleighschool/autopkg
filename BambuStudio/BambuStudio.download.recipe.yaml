---
Identifier: com.github.woodleighschool.download.BambuStudio
ParentRecipe: com.github.dataJAR-recipes.download.BambuStudio
MinimumVersion: "2.7"

Input:
  NAME: BambuStudio
  PRERELEASE: "true"

Process:
  - Processor: Versioner
    Arguments:
      input_plist_path: "%pathname%/BambuStudio.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
      overwrite: false
      source_path: "%pathname%"

  - Processor: VariableSetter
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
