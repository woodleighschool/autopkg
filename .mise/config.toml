[tools]
python = "3.14.7"
lefthook = "2.1.10"
actionlint = "1.7.12"
zizmor = "1.29.0"
oxfmt = "0.63.0"

[settings]
experimental = true
pin = true
lockfile = true
minimum_release_age = "12 hours"

[env]
_.python.venv = { path = ".venv", create = true }

[deps.pip]
auto = true

[tasks.format]
description = "Format repository files and normalize recipes"
run = ["python scripts/sort.py", "oxfmt . '!.mise/**'"]

[tasks.fmt-check]
description = "Check repository formatting"
run = ["python scripts/sort.py --check", "oxfmt --check . '!.mise/**'"]

[tasks.lint]
description = "Run repository checks"
depends = ["fmt-check", "validate", "workflow-lint"]

[tasks.validate]
description = "Validate Woodstar Munki recipes"
run = "python scripts/validate.py"

[tasks.workflow-lint]
description = "Lint GitHub Actions workflows"
run = ["actionlint", "zizmor --offline --no-ignores .github/workflows"]

[hooks]
postinstall = "lefthook install"
