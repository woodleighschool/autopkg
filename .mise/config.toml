[tools]
python = "3.14.7"
lefthook = "2.1.12"
actionlint = "1.7.12"
zizmor = "1.30.0"
oxfmt = "0.65.0"

[settings]
experimental = true
pin = true
lockfile = true

[env]
_.python.venv = { path = ".venv", create = true }

[deps.pip]
auto = true

[tasks.format]
description = "Format YAML, JSON, and Markdown"
run = ["python scripts/sort.py", "oxfmt . '!.mise/**'"]

[tasks.fmt-check]
description = "Check YAML, JSON, and Markdown formatting"
run = ["python scripts/sort.py --check", "oxfmt --check . '!.mise/**'"]

[tasks.lint]
description = "Run static checks"
depends = ["fmt-check", "workflow-lint"]

[tasks.workflow-lint]
description = "Lint GitHub Actions workflows"
run = ["actionlint", "zizmor --offline .github/workflows"]

[hooks]
postinstall = "lefthook install"
