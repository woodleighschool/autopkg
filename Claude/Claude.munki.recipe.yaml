---
Identifier: com.github.woodleighschool.munki.Claude
ParentRecipe: com.github.almenscorner.download.Claude
MinimumVersion: "1.1.0"

GitOps: true
Input:
  MUNKI_CATEGORY: Productivity
  NAME: Claude
  pkginfo:
    category: "%MUNKI_CATEGORY%"
    description: >-
      Claude is Anthropic's AI assistant for desktop, designed for deep work
      and focused, fast collaboration.
    developer: Anthropic
    name: "%NAME%"
    unattended_install: true
    unattended_uninstall: true
    uninstall_method: remove_copied_items
    uninstallable: true

Process:
  - Processor: MunkiInstallsItemsCreator
    Arguments:
      faux_root: "%RECIPE_CACHE_DIR%/unpacked"
      installs_item_paths:
        - /Applications/Claude.app

  - Processor: MunkiPkginfoMerger

  - Processor: com.github.woodleighschool.processors/MunkiIconExtractor
    Arguments:
      NAME: "%NAME%"
      output_dir: "%RECIPE_CACHE_DIR%"
      pathname: "%RECIPE_CACHE_DIR%/unpacked/Claude.app"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      munkiimport_appname: "%NAME%.app"
      pkg_path: "%dmg_path%"
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Staff
            package:
              strategy: latest

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiPackageCleaner
    Arguments:
      keep_version_count: 1
