---
Identifier: com.github.woodleighschool.download.Claude
ParentRecipe: com.github.almenscorner.download.Claude
MinimumVersion: "2.7"

Input:
  NAME: Claude

Process:
  - Processor: Versioner
    Arguments:
      input_plist_path: "%pathname%/Claude.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
      overwrite: false
      source_path: "%pathname%"

  - Processor: VariableSetter
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
