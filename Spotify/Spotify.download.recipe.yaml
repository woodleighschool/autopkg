---
Identifier: com.github.woodleighschool.download.Spotify
ParentRecipe: com.github.autopkg.download.Spotify
MinimumVersion: "2.7"

Input:
  DOWNLOAD_ARCH: ARM64
  NAME: Spotify
  SUPPORTED_ARCH: arm64

Process:
  - Processor: Versioner
    Arguments:
      input_plist_path: "%pathname%/Spotify.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
      overwrite: false
      source_path: "%pathname%"

  - Processor: VariableSetter
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
