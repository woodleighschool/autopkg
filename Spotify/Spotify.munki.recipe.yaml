---
Identifier: com.github.woodleighschool.munki.Spotify
ParentRecipe: com.github.woodleighschool.download.Spotify
MinimumVersion: "1.1.0"

Input:
  DOWNLOAD_ARCH: ARM64
  MUNKI_CATEGORY: Media
  NAME: Spotify
  pkginfo:
    blocking_applications:
      - Spotify
    category: "%MUNKI_CATEGORY%"
    description: >-
      Spotify is a digital music service that gives you access to millions of
      songs.
    developer: Spotify
    name: "%NAME%"
    postinstall_script: |-
      #!/bin/bash
      /bin/chmod -R go+rX /Applications/Spotify.app
    unattended_install: true
    unattended_uninstall: true
    uninstall_method: remove_copied_items
    uninstallable: true

Process:
  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/payload/Applications/%NAME%.app"
      overwrite: true
      source_path: "%pkg_path%/%NAME%.app"

  - Processor: MunkiInstallsItemsCreator
    Arguments:
      derive_minimum_os_version: true
      faux_root: "%RECIPE_CACHE_DIR%/payload"
      installs_item_paths:
        - /Applications/Spotify.app

  - Processor: MunkiPkginfoMerger

  - Processor: com.github.woodleighschool.processors/MunkiIconExtractor
    Arguments:
      NAME: "%NAME%"
      output_dir: "%RECIPE_CACHE_DIR%"
      pathname: "%RECIPE_CACHE_DIR%/payload/Applications/%NAME%.app"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/payload"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      munkiimport_appname: "%NAME%.app"
      pkg_path: "%pkg_path%"
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Hosts
            package:
              strategy: latest
