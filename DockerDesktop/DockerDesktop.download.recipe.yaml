---
Identifier: com.github.woodleighschool.download.DockerDesktop
MinimumVersion: "3.0"

Input:
  NAME: Docker Desktop

Process:
  - Processor: URLTextSearcher
    Arguments:
      re_pattern: '(?P<download_url>https://desktop\.docker\.com/mac/main/arm64/[A-Za-z0-9]+/Docker\.dmg)'
      url: https://docs.docker.com/desktop/release-notes/

  - Processor: URLDownloader
    Arguments:
      filename: DockerDesktop.dmg
      url: "%download_url%"

  - Processor: EndOfCheckPhase

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: "%pathname%/Docker.app"
      requirement: >-
        identifier "com.docker.docker" and anchor apple generic and
        certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and
        certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and
        certificate leaf[subject.OU] = "9BNSXJN65R"
