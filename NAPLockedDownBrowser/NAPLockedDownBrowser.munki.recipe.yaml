---
Identifier: com.github.woodleighschool.munki.NAPLockedDownBrowser
ParentRecipe: com.github.woodleighschool.download.NAPLockedDownBrowser
MinimumVersion: "2.7"

Input:
  MUNKI_CATEGORY: Education
  NAME: NAP Locked down browser
  pkginfo:
    blocking_applications:
      - NAP Locked down browser
      - NAP Locked down browser Uninstaller
    category: "%MUNKI_CATEGORY%"
    description: >-
      The NAP Locked down browser lets students securely participate in
      NAPLAN and NAP Sample tests by preventing access to other applications
      and unauthorised device resources during an assessment.
    developer: ACARA
    minimum_os_version: "14.0"
    name: "%NAME%"
    requires:
      - Rosetta
    unattended_install: true
    unattended_uninstall: true
    uninstall_method: removepackages
    uninstallable: true

Process:
  - Processor: FlatPkgUnpacker
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/unpacked"
      flat_pkg_path: "%pathname%"
      purge_destination: true

  - Processor: PkgPayloadUnpacker
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/payload"
      pkg_payload_path: "%RECIPE_CACHE_DIR%/unpacked/NAP_Locked_down_browser.pkg/Payload"
      purge_destination: true

  - Processor: Versioner
    Arguments:
      input_plist_path: "%RECIPE_CACHE_DIR%/payload/Applications/%NAME%.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: PkgCopier
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.pkg"
      source_pkg: "%pathname%"

  - Processor: MunkiPkginfoMerger
    Arguments:
      additional_pkginfo:
        version: "%version%"

  - Processor: MunkiInstallsItemsCreator
    Arguments:
      faux_root: "%RECIPE_CACHE_DIR%/payload"
      installs_item_paths:
        - /Applications/NAP Locked down browser.app
      version_comparison_key: CFBundleShortVersionString

  - Processor: MunkiPkginfoMerger

  - Processor: com.github.woodleighschool.processors/MunkiIconExtractor
    Arguments:
      NAME: "%NAME%"
      output_dir: "%RECIPE_CACHE_DIR%"
      overwrite: false
      pathname: "%RECIPE_CACHE_DIR%/payload/Applications/%NAME%.app"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/unpacked"
        - "%RECIPE_CACHE_DIR%/payload"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      pkg_path: "%pkg_path%"
      targets:
        exclude: []
        include:
          - actions:
              - managed_installs
            label_name: SAC MacBooks
            package:
              strategy: latest
          - actions:
              - managed_installs
            label_name: NAPLAN Students
            package:
              strategy: latest

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiPackageCleaner
    Arguments:
      keep_version_count: 1
