---
Identifier: com.github.woodleighschool.munki.WoodleighFonts
ParentRecipe: com.github.woodleighschool.pkg.WoodleighFonts
MinimumVersion: "1.1.0"

Input:
  MUNKI_CATEGORY: Fonts
  NAME: Woodleigh Fonts
  VERSION: "1.0.0"

  pkginfo:
    category: "%MUNKI_CATEGORY%"
    description: >-
      Woodleigh School managed font bundle.
    developer: Woodleigh
    name: "%NAME%"
    unattended_install: true

Process:
  - Processor: com.github.woodleighschool.processors/SwiftIconExtractor
    Arguments:
      input_path: /System/Applications/Font Book.app

      NAME: "%NAME%"
      output_dir: "%RECIPE_CACHE_DIR%"
  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      pkg_path: "%pkg_path%"
      targets:
        exclude: []
        include:
          - actions:
              - managed_installs
            label_name: All Hosts
            package:
              strategy: latest
