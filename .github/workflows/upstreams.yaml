---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AutoPkg upstreams

on:
  pull_request:
    branches:
      - main
    paths:
      - autopkg-repos.json
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  AUTOPKG_DIFF_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}

jobs:
  inspect:
    name: Inspect pinned changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true
          install_args: --locked python

      - name: Sync and inspect pinned repositories
        env:
          WOODLEIGH_AUTOPKG_REPO_ROOT: ${{ runner.temp }}/AutoPkg/RecipeRepos
        run: mise run repos:diff
