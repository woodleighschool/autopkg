---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AutoPkg

on:
  workflow_dispatch:
    inputs:
      recipe:
        description: Optional recipe name, for example GoogleChrome
        type: string
        default: ""
        required: false

concurrency:
  group: autopkg
  cancel-in-progress: false

permissions:
  contents: read

env:
  MISE_NO_HOOKS: "1"
  MISE_TASK_RUN_AUTO_INSTALL: "false"

jobs:
  run:
    name: Run AutoPkg
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on:
      group: autopkg
    timeout-minutes: 180
    env:
      WOODSTAR_URL: ${{ vars.WOODSTAR_URL }}
      WOODSTAR_TOKEN: ${{ secrets.WOODSTAR_TOKEN }}
      ACTIVINSPIRE_SERIAL: ${{ secrets.ACTIVINSPIRE_SERIAL }}
      REQUESTED_RECIPE: ${{ inputs.recipe }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true
          install_args: --locked python

      - name: Run production recipes
        run: |
          if [[ -n "$REQUESTED_RECIPE" ]]; then
            mise run autopkg:run -- "$REQUESTED_RECIPE"
          else
            mise run autopkg:run
          fi

      - name: Upload sanitized run summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autopkg-summary-${{ github.run_id }}
          path: .artifacts/autopkg-summary.*
          if-no-files-found: warn
          retention-days: 14
