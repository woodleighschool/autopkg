---
Identifier: com.github.woodleighschool.intune.Munki
ParentRecipe: com.github.woodleighschool.download.Munki
MinimumVersion: "3.0"

Input:
  description: >-
    Munki is a set of tools that, used together with a webserver-based 
    repository of packages and package metadata, can be used by macOS 
    administrators to manage software installs (and in many cases removals) 
    on macOS client machines.
  NAME: Munki
  publisher: Mac Admins Open Source

Process:
  - Processor: FlatPkgUnpacker
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/unpacked"
      flat_pkg_path: "%pathname%"
      purge_destination: true

  - Processor: PkgPayloadUnpacker
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/payload"
      pkg_payload_path: "%RECIPE_CACHE_DIR%/unpacked/munkitools_app.pkg/Payload"
      purge_destination: true

  - Processor: PlistReader
    Arguments:
      info_path: "%RECIPE_CACHE_DIR%/payload/Applications/Managed Software Center.app/Contents/Info.plist"
      plist_keys:
        CFBundleIdentifier: bundle_id
        CFBundleShortVersionString: bundle_version

  - Processor: com.github.woodleighschool.processors/SwiftIconExtractor
    Arguments:
      NAME: "%NAME%"
      output_dir: "%RECIPE_CACHE_DIR%"
      overwrite: true
      pathname: "%RECIPE_CACHE_DIR%/payload/Applications/Managed Software Center.app"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/unpacked"
        - "%RECIPE_CACHE_DIR%/payload"

  - Processor: com.github.almenscorner.intune-upload.processors/IntuneAppUploader
    Arguments:
      app_file: "%flat_pkg_path%"
      assignment_info:
        - all_assignment: AllDevices
          #intent: Required
          intent: Available
      bundleId: "%bundle_id%"
      bundleVersion: "%bundle_version%"
      description: "%description%"
      displayname: "%NAME%"
      icon: "%icon_path%"
      ignore_version_detection: true
      minimumSupportedOperatingSystem: v11_0
      publisher: "%publisher%"
      sync_assignments: true
