---
Identifier: com.github.woodleighschool.download.VisualStudioCode
ParentRecipe: com.github.jc0b.download.VisualStudioCode
MinimumVersion: "2.7.6"

Input:
  ARCH: arm64
  NAME: Visual Studio Code

Process:
  - Processor: Versioner
    Arguments:
      input_plist_path: "%pathname%/Visual Studio Code.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
      overwrite: false
      source_path: "%pathname%"

  - Processor: VariableSetter
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
