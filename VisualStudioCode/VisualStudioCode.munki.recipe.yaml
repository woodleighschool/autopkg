---
Identifier: com.github.woodleighschool.munki.VisualStudioCode
ParentRecipe: com.github.woodleighschool.download.VisualStudioCode
MinimumVersion: "3.0"

Input:
  MUNKI_CATEGORY: Programming
  NAME: Visual Studio Code
  pkginfo:
    blocking_applications:
      - Visual Studio Code.app
    category: "%MUNKI_CATEGORY%"
    description: >-
      Visual Studio Code is a code editor redefined and optimized for building
      and debugging modern web and cloud applications.
    developer: Microsoft
    name: "%NAME%"
    postinstall_script: |-
      #!/bin/bash
      ln -sf "/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code" "/usr/local/bin/code"
    postuninstall_script: |-
      #!/bin/bash
      rm -f "/usr/local/bin/code"
    unattended_install: true
    unattended_uninstall: true
    uninstall_method: remove_copied_items
    uninstallable: true

Process:
  - Processor: com.github.woodleighschool.processors/SwiftIconExtractor
    Arguments:
      app_name: Visual Studio Code.app
      input_path: "%pathname%"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%icon_path%"
      munkiimport_appname: "%NAME%.app"
      pkg_path: "%pathname%"
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Hosts
            package:
              strategy: latest

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiPackageCleaner
    Arguments:
      keep_version_count: 1
