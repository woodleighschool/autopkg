---
Identifier: com.github.woodleighschool.munki.CreativeCloud
ParentRecipe: com.github.woodleighschool.pkg.CreativeCloud
MinimumVersion: "2.7"

GitOps: true
Input:
  MUNKI_APP_PATH: /Applications/Utilities/Adobe Creative Cloud/ACC/Creative Cloud.app
  MUNKI_CATEGORY: Creativity
  NAME: Adobe Creative Cloud
  pkginfo:
    blocking_applications:
      - Creative Cloud
      - Creative Cloud Desktop App
      - Creative Cloud Installer
    category: "%MUNKI_CATEGORY%"
    description: >-
      Adobe Creative Cloud provides access to Adobe desktop apps, services, and
      creative resources from the Creative Cloud desktop app.
    developer: Adobe
    minimum_os_version: "11.0"
    name: "%NAME%"
    unattended_install: true
    unattended_uninstall: true
    uninstall_method: uninstall_script
    uninstall_script: |-
      #!/bin/bash
      app_path="%MUNKI_APP_PATH%"
      uninstaller="/Applications/Utilities/Adobe Creative Cloud/Utils/Creative Cloud Uninstaller.app/Contents/MacOS/Creative Cloud Uninstaller"
      if [[ ! -d "$app_path" ]]; then
        exit 0
      fi
      if [[ ! -x "$uninstaller" ]]; then
        echo "Adobe Creative Cloud uninstaller not found: $uninstaller"
        exit 1
      fi
      "$uninstaller" --uninstall=1
      status=$?
      if [[ -d "$app_path" ]]; then
        echo "Adobe Creative Cloud is still installed."
        exit 1
      fi
      exit "$status"
    uninstallable: true
    uninstallcheck_script: |-
      #!/bin/bash
      if [[ -d "%MUNKI_APP_PATH%" ]]; then
        exit 0
      fi
      exit 1

Process:
  - Processor: MunkiPkginfoMerger
    Arguments:
      additional_pkginfo:
        installs:
          - CFBundleShortVersionString: "%version%"
            path: "%MUNKI_APP_PATH%"
            type: application
            version_comparison_key: CFBundleShortVersionString
        version: "%version%"

  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      overwrite: false
      source_path: "%RECIPE_DIR%/Adobe Creative Cloud.png"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      pkg_path: "%pkg_path%"
      targets:
        exclude: []
        include:
          - actions:
              - optional_installs
              - managed_updates
            label_name: All Hosts
            package:
              strategy: latest

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiPackageCleaner
    Arguments:
      keep_version_count: 1
