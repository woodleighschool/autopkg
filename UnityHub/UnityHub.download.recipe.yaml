---
Identifier: com.github.woodleighschool.download.UnityHub
ParentRecipe: com.github.hansen-m.download.UnityHub
MinimumVersion: "2.7.6"

Input:
  BUILD: arm64
  NAME: Unity Hub

Process:
  - Processor: Versioner
    Arguments:
      input_plist_path: "%pathname%/Unity Hub.app/Contents/Info.plist"
      plist_version_key: CFBundleShortVersionString

  - Processor: Copier
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
      overwrite: false
      source_path: "%pathname%"

  - Processor: VariableSetter
    Arguments:
      pkg_path: "%RECIPE_CACHE_DIR%/%NAME%-%version%.dmg"
