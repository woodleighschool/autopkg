---
Identifier: com.github.woodleighschool.download.UnityHub
MinimumVersion: "3.0"

Input:
  DOWNLOAD_URL: https://public-cdn.cloud.unity3d.com/hub/prod/UnityHubSetup-arm64.dmg

  NAME: Unity Hub
Process:
  - Processor: URLDownloader
    Arguments:
      filename: UnityHub.dmg
      url: "%DOWNLOAD_URL%"

  - Processor: EndOfCheckPhase

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: "%pathname%/Unity Hub.app"
      requirement: >-
        identifier "com.unity3d.unityhub" and anchor apple generic and
        certificate 1[field.1.2.840.113635.100.6.2.6] /* exists */ and
        certificate leaf[field.1.2.840.113635.100.6.1.13] /* exists */ and
        certificate leaf[subject.OU] = "9QW8UQUTAA"
