---
Identifier: com.github.woodleighschool.munki.Sophos
ParentRecipe: com.github.woodleighschool.pkg.Sophos
MinimumVersion: "2.7"

Input:
  MUNKI_CATEGORY: Security
  NAME: Sophos
  pkginfo:
    category: "%MUNKI_CATEGORY%"
    description: >-
      By combining cutting-edge technologies, such as deep learning and
      endpoint detection and response, Intercept X delivers unmatched
      protection against unknown malware, exploits, and ransomware.
    developer: Sophos
    installcheck_script: |-
      #!/bin/bash
      service="/Library/Sophos Anti-Virus/SophosServiceManager.app/Contents/MacOS/SophosServiceManager"

      if [[ ! -f "$service" ]]; then
        exit 0
      fi

      if ! /usr/bin/pgrep -f "$service" >/dev/null 2>&1; then
        exit 0
      fi

      exit 1
    minimum_os_version: "13.5"
    name: "%NAME%"
    postinstall_script: |
      #!/bin/bash
      until pgrep -x "Dock" &>/dev/null; do
        sleep 10
      done

      INSTALLER_DIR="/Library/Application Support/Woodleigh/Sophos"
      INSTALLER="$INSTALLER_DIR/Sophos Installer.app/Contents/MacOS/Sophos Installer"
      HELPER="$INSTALLER_DIR/Sophos Installer.app/Contents/MacOS/tools/com.sophos.bootstrap.helper"

      cleanup() {
        /bin/rm -rf "$INSTALLER_DIR"
      }
      trap cleanup EXIT

      /bin/chmod a+x "$INSTALLER" "$HELPER"
      cd "$INSTALLER_DIR" || exit 1
      "$INSTALLER" --quiet
    unattended_install: true

Process:
  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%RECIPE_REPO_DIR%/com.github.woodleighschool.autopkg/Sophos/Sophos.png"
      pkg_path: "%pkg_path%"
      targets:
        exclude:
          - label_name: Defender Test
        include:
          - actions:
              - managed_installs
            label_name: All Hosts
            package:
              strategy: latest
