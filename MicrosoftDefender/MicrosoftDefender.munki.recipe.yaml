---
Identifier: com.github.woodleighschool.munki.MicrosoftDefender
ParentRecipe: com.github.rtrouton.pkg.microsoftdefender
MinimumVersion: "2.7"

GitOps: true
Input:
  MUNKI_CATEGORY: Security
  NAME: Microsoft Defender
  pkginfo:
    category: "%MUNKI_CATEGORY%"
    description: >-
      Microsoft Defender for Endpoint helps prevent, detect, investigate,
      and respond to threats across devices.
    developer: Microsoft
    name: "%NAME%"
    unattended_install: true
    uninstall_method: ""
    uninstallable: false

Process:
  - Processor: FlatPkgUnpacker
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/unpacked"
      flat_pkg_path: "%pkg_path%"
      purge_destination: true

  - Processor: FileFinder
    Arguments:
      pattern: "%RECIPE_CACHE_DIR%/unpacked/*wdav*.pkg"

  - Processor: PkgPayloadUnpacker
    Arguments:
      destination_path: "%RECIPE_CACHE_DIR%/payload/Applications"
      pkg_payload_path: "%found_filename%/Payload"
      purge_destination: true

  - Processor: MunkiInstallsItemsCreator
    Arguments:
      derive_minimum_os_version: true
      faux_root: "%RECIPE_CACHE_DIR%/payload"
      installs_item_paths:
        - /Applications/Microsoft Defender.app

  - Processor: MunkiPkginfoMerger

  - Processor: com.github.woodleighschool.processors/MunkiIconExtractor
    Arguments:
      NAME: "%NAME%"
      output_dir: "%RECIPE_CACHE_DIR%"
      overwrite: false
      pathname: "%RECIPE_CACHE_DIR%/payload/Applications/%NAME%.app"

  - Processor: PathDeleter
    Arguments:
      path_list:
        - "%RECIPE_CACHE_DIR%/unpacked"
        - "%RECIPE_CACHE_DIR%/payload"

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiImporter
    Arguments:
      icon_path: "%RECIPE_CACHE_DIR%/%NAME%.png"
      pkg_path: "%pkg_path%"
      targets:
        exclude: []
        include:
          - actions:
              - managed_installs
            label_name: Defender Test
            package:
              strategy: latest

  - Processor: com.github.woodleighschool.woodstar.processors/WoodstarMunkiPackageCleaner
    Arguments:
      keep_version_count: 1
